[dependency-groups]
dev = [
    "patchright",
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["packages", "tests"]

[tool.uv.workspace]
members = ["packages/surf-agent", "packages/surf-google-search"]

[tool.uv.sources]
surf-agent = { workspace = true }
surf-google-search = { workspace = true }
