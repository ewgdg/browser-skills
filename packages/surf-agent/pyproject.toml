[project]
name = "surf-agent"
version = "0.1.0"
description = "Agent-scoped wrapper for generic surf browser control"
requires-python = ">=3.11"
dependencies = [
    "patchright>=1.60.1,<2",
    "platformdirs",
    "psutil>=7.2.2",
    "tldextract>=5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
